# Full-US Gowalla. Per the PI's direction, this is now for the Phase 8
# scalability study ONLY -- metro-level subsets (data_gowalla_nyc.yaml etc.)
# are the main experimental unit.
path: data/raw/gowalla/loc-gowalla_totalCheckins.txt
bbox: us
min_obs: 20
train_frac: 0.8
nonmember_traj_frac: 0.2
user_disjoint_frac: 0.1
seed: 0
allow_null_latlon: false
grid_resolution_deg: 0.01
run_h3_check: true
h3_resolution: 8
