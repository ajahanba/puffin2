# Raw Microsoft GeoLife 1.3 (182 users, real lat/lon) -- the main GeoLife
# build going forward. See configs/data_geolife_sample.yaml for the small
# pre-gridded Mo-PAE sample, kept only for Phase 0 legacy-mode comparisons.
data_dir: "data/raw/geolife_full/Geolife Trajectories 1.3/Data"
min_obs: 20
train_frac: 0.8
nonmember_traj_frac: 0.2
user_disjoint_frac: 0.1
seed: 0
allow_null_latlon: false
grid_resolution_deg: 0.01
run_h3_check: true
h3_resolution: 8
